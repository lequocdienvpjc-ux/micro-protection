name: Build APK + Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén mã nguồn (bundle + các bản vá)
        run: for f in bundle*.tar.gz; do [ -f "$f" ] && echo "Giai nen $f" && tar -xzf "$f"; done; ls app/assets || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Tạo thư mục native Android + Web
        working-directory: app
        run: flutter create . --platforms=android,web --org vn.microprotection --project-name micro_protection

      - name: Cấu hình Android/Web (quyền, tên app, icon, PWA)
        run: python3 tool/patch_android.py app

      - name: Cài thư viện
        working-directory: app
        run: flutter pub get

      - name: Kiểm tra mã nguồn
        working-directory: app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Chạy unit test
        working-directory: app
        continue-on-error: true
        run: flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Build Web (PWA cho iPhone)
        working-directory: app
        run: flutter build web --release --base-href "/micro-protection/"

      - name: Đặt tên file
        run: cp app/build/app/outputs/flutter-apk/app-release.apk "TuongTro-v0.3.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TuongTro-*.apk

      - name: Phát hành bản tải về
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tương trợ v0.3.${{ github.run_number }}
          body: |
            Android: tải file APK bên dưới và cài trực tiếp (bật "Cho phép cài từ nguồn không xác định").
            iPhone: mở https://lequocdienvpjc-ux.github.io/micro-protection/ bằng Safari → Chia sẻ → "Thêm vào Màn hình chính".
          files: TuongTro-*.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
