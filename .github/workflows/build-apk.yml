name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén mã nguồn (bundle + các bản vá)
        run: for f in bundle*.tar.gz; do [ -f "$f" ] && echo "Giai nen $f" && tar -xzf "$f"; done; ls app/assets || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Tạo thư mục native Android
        working-directory: app
        run: flutter create . --platforms=android --org vn.microprotection --project-name micro_protection

      - name: Cấu hình Android (quyền GPS, Internet, minSdk, tên app, icon)
        run: python3 tool/patch_android.py app

      - name: Cài thư viện
        working-directory: app
        run: flutter pub get

      - name: Kiểm tra mã nguồn
        working-directory: app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Chạy unit test
        working-directory: app
        continue-on-error: true
        run: flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Đặt tên file
        run: cp app/build/app/outputs/flutter-apk/app-release.apk "TuongTro-v0.2.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TuongTro-*.apk

      - name: Phát hành bản tải về
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tương trợ v0.2.${{ github.run_number }}
          body: Bản APK cài đặt trực tiếp cho Android (bật "Cho phép cài từ nguồn không xác định").
          files: TuongTro-*.apk
